name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (testes e cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar, testar e gerar relatório de cobertura
        run: mvn -B verify
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Imagens Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir as imagens
        run: docker compose build
        env:
          DB_PASSWORD: ci
          JWT_SECRET: segredo-usado-apenas-para-validar-o-build-no-ci
          ADMIN_SENHA: SenhaDoCi123
